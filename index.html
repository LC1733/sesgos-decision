<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.svg" type="image/svg+xml">
<title>Matriz de Sesgos en la Decisión</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08090d;color:#f4f1e8;font:15px system-ui,sans-serif}.loading{opacity:.7;letter-spacing:.04em}</style>
</head>
<body><div class="loading">Cargando matriz de sesgos…</div><script>
(async()=>{
  const names=['app1.b64','app2.b64','app3a.b64','app3b1.b64','app3b2a.b64','app3b2b1a.b64','app3b2b1b.b64','app3b2b2.b64','app4.b64'];
  const parts=[];
  for(const name of names){
    const r=await fetch(name,{cache:'no-store'});
    if(!r.ok) throw new Error(name+': '+r.status);
    parts.push((await r.text()).trim());
  }
  const b64=parts.join('');
  const raw=atob(b64);
  const bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
  const ds=new DecompressionStream('gzip');
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  document.open();document.write(html);document.close();
})().catch(err=>{
  document.body.innerHTML='<pre style="padding:24px;white-space:pre-wrap">No se pudo cargar la aplicación. '+String(err)+'</pre>';
});
</script></body>
</html>
